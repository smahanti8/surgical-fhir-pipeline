name: Gitleaks
on:
  push:
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Required by the action to scan pull_request events (it lists the PR's
          # commits through the API); push events don't need it. Not a secret we
          # manage: GitHub issues this token per run, read-only by default here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
