name: Gitleaks
on:
  push:
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # Required by the action to scan pull_request events (it lists the PR's
          # commits through the API); push events don't need it. Not a secret we
          # manage: GitHub issues this token per run, read-only by default here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
