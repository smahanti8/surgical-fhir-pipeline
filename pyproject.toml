[project]
name = "surgical-fhir-pipeline"
version = "0.1.0"
description = "Synthetic robotic-assisted surgery telemetry -> FHIR R4B interoperability pipeline"
requires-python = ">=3.10"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
# fhir.resources models are pydantic v2; without this plugin mypy flags 46
# false positives across mapping.py/provenance.py/api.py where dicts and plain
# str/date values are passed to constructors that pydantic validates/coerces
# correctly at runtime. The plugin alone resolved all of them - no per-module
# overrides needed.
plugins = ["pydantic.mypy"]
